<!-- Thinkstack app icon master. Render at 1024x1024 on a transparent
     background, then regenerate all sizes with: npx tauri icon <png> -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA3F0"/>
      <stop offset="1" stop-color="#1E6FD6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0b3a6e" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- macOS-style squircle with ~10% transparent margin -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#sheen)"/>

  <!-- stack of note cards, back to front -->
  <rect x="352" y="286" width="320" height="220" rx="34" fill="#ffffff" opacity="0.32"/>
  <rect x="316" y="358" width="392" height="240" rx="38" fill="#ffffff" opacity="0.55"/>
  <rect x="280" y="436" width="464" height="302" rx="42" fill="#ffffff" filter="url(#cardShadow)"/>

  <!-- text lines on the front card -->
  <rect x="340" y="512" width="264" height="36" rx="18" fill="#2383E2"/>
  <rect x="340" y="584" width="344" height="26" rx="13" fill="#9DBEE2"/>
  <rect x="340" y="642" width="296" height="26" rx="13" fill="#C2D6ED"/>

  <!-- idea spark -->
  <path d="M760 244 l24 62 62 24 -62 24 -24 62 -24 -62 -62 -24 62 -24 z" fill="#FFD84D"/>
  <path d="M846 396 l11 28 28 11 -28 11 -11 28 -11 -28 -28 -11 28 -11 z" fill="#FFD84D" opacity="0.85"/>
</svg>
